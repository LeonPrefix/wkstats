<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="en_US" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />

    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/min/font-awesome.min.css" />
    <link rel="stylesheet" href="/css/min/bootstrap-4.1.1.min.css" />

    <title>wkstats</title>
    <meta name="application-name" content="WaniKani Statistics" />
    <meta
      name="description"
      content="Track your progress on WaniKani. Estimate your completion date. Track your progress toward JLPT levels."
    />

    <script src="/js/min/jquery-3.3.1.min.js"></script>
  </head>

  <body>
    <section class="container nav_header">
      <hr class="title_underline" />
      <nav class="navbar navbar-expand-sm navbar-light">
        <a class="navbar-brand" href="/">
          <img class="header_logo" alt="WaniKani Statistics" src="/images/site_logo.png" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="navbar-item active">
              <a
                class="nav-link"
                href="/progress"
                data-toggle="dropdown"
                id="navbarProgressMenuLink"
                aria-haspopup="true"
                aria-expanded="false"
              >
                Progress
              </a>
              <div class="dropdown-menu" aria-labelledby="navbarProgressMenuLink">
                <a class="dropdown-item ilink" href="/progress/dashboard">Dashboard</a>
                <a class="dropdown-item ilink" href="/progress/level-up">Level-up</a>
                <a class="dropdown-item ilink" href="/progress/projections">Projections</a>
              </div>
            </li>
            <li class="navbar-item">
              <a
                class="nav-link"
                href="/items"
                data-toggle="dropdown"
                id="navbarItemsMenuLink"
                aria-haspopup="true"
                aria-expanded="false"
              >
                Items
              </a>
              <div class="dropdown-menu" aria-labelledby="navbarItemsMenuLink">
                <a class="dropdown-item ilink" href="/items/wanikani">Wanikani</a>
                <a class="dropdown-item ilink" href="/items/jlpt">JLPT</a>
                <a class="dropdown-item ilink" href="/items/joyo">Joyo</a>
                <a class="dropdown-item ilink" href="/items/frequency">Frequency</a>
              </div>
            </li>
            <li class="navbar-item">
              <a
                class="nav-link"
                href="/charts"
                data-toggle="dropdown"
                id="navbarChartsMenuLink"
                aria-haspopup="true"
                aria-expanded="false"
              >
                Charts
              </a>
              <div class="dropdown-menu" aria-labelledby="navbarChartsMenuLink">
                <a class="dropdown-item ilink" href="/charts/jlpt">JLPT</a>
                <a class="dropdown-item ilink" href="/charts/joyo">Joyo</a>
                <a class="dropdown-item ilink" href="/charts/frequency">Frequency</a>
                <a class="dropdown-item ilink" href="/charts/reading">Reading</a>
              </div>
            </li>
            <li class="navbar-item user-menu">
              <a
                class="nav-link"
                href="/login"
                data-toggle="none"
                id="navbarUserMenuLink"
                aria-haspopup="true"
                aria-expanded="false"
              >
                Login
              </a>
              <div class="dropdown-menu" aria-labelledby="navbarUserMenuLink">
                <a class="dropdown-item ilink" href="/refresh">Refresh Data</a>
                <a class="dropdown-item ilink" href="/settings">Settings</a>
                <a class="dropdown-item ilink" href="/logout">Logout</a>
              </div>
            </li>
          </ul>
        </div>
      </nav>
    </section>

    <section class="container main-content"></section>

    <script src="/js/min/bootstrap-4.1.1.min.js"></script>

    <script src="/js/util/Core.js"></script>
    <script src="/js/util/nav.js"></script>
    <script src="/js/util/startup.js"></script>
  </body>
</html>
